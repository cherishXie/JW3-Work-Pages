  #workbench-boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background-color:var(--wb-bg,#f3eedf);background-image:radial-gradient(circle,rgba(121,79,39,.07) 1px,transparent 1.4px);background-size:22px 22px;color:var(--wb-text,#3d2e1b);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .boot-content{width:min(372px,calc(100vw - 40px));text-align:center;padding:30px 26px 24px;background:var(--wb-surface,#fffcf2);border:2px solid var(--wb-border,#e4d9c2);border-radius:26px;box-shadow:0 4px 0 #e2d5bb,0 18px 40px -30px rgba(61,52,40,.5)}
  .boot-mark{width:92px;height:92px;margin:0 auto 18px;color:var(--wb-primary,#0e8c7f);background:var(--wb-primary-soft,#d9f5ef);border:2px solid #b9e4d8;border-radius:28px;display:grid;place-items:center}
  .boot-mark svg{display:block;width:60px;height:60px}
  .boot-mark path{stroke-dasharray:90;stroke-dashoffset:0;animation:boot-draw 900ms ease-out both}
  .boot-content h1{margin:0;font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.4px}
  .boot-features{font-size:12px;color:var(--wb-text-secondary,#6b5942);margin:14px 0 22px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
  .boot-features span{padding:5px 11px;border:1.5px solid var(--wb-border,#e4d9c2);border-radius:999px;background:var(--wb-bg,#f3eedf)}
  .boot-track{height:10px;background:var(--wb-track,#ebe1cc);border-radius:999px;overflow:hidden;margin-bottom:16px;border:1.5px solid var(--wb-border,#e4d9c2)}
  .boot-track span{display:block;height:100%;width:100%;border-radius:999px;background:var(--wb-primary,#0e8c7f);transform-origin:left;animation:boot-charge 1200ms ease-out both}
  #boot-status{font-size:14px;font-weight:600;margin:0}
  #boot-elapsed{display:block;margin-top:6px;font-size:12px;color:var(--wb-text-muted,#8b7a61)}
  #boot-retry{margin-top:12px}
  #boot-hint{font-size:12px;color:var(--wb-text-muted,#8b7a61);margin:10px 0}
  #boot-error{text-align:left;margin-top:10px;font-size:12px}
  #boot-error pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;max-height:120px;overflow:auto}
  #boot-recovery:not([hidden]){display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
  .boot-caption{font-size:12px;color:var(--wb-text-muted,#8b7a61);margin-top:20px}
  #boot-retry,#boot-backup,#boot-repair{min-height:34px;padding:6px 16px;border:1.5px solid var(--wb-border,#e4d9c2);border-radius:999px;background:var(--wb-surface,#fffcf2);color:var(--wb-text,#3d2e1b);font-weight:600;cursor:pointer;box-shadow:0 2px 0 #ddd0b6}
  #boot-retry:hover,#boot-backup:hover,#boot-repair:hover{transform:translateY(-1px)}
  @keyframes boot-draw{from{stroke-dashoffset:90;opacity:.2}to{stroke-dashoffset:0;opacity:1}}
  @keyframes boot-charge{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
  @media(prefers-reduced-motion:reduce){.boot-mark path,.boot-track span{animation:none}}
  </style>
